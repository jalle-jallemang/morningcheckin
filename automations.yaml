- id: '1772543426843'
  alias: Motion Light Strip Evening/Night
  description: ''
  triggers:
  - trigger: state
    entity_id: binary_sensor.jalle_studio_sensor_motion
    to: 'on'
  - trigger: state
    entity_id: binary_sensor.jalle_studio_sensor_motion
    to: 'off'
    for:
      minutes: 5
  conditions:
  - condition: or
    conditions:
    - condition: time
      after: '14:00:00'
      before: '23:59:59'
    - condition: time
      after: 00:00:00
      before: 08:00:00
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.jalle_studio_sensor_motion
        state: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.jalle_studio_light_strip
        data:
          brightness_pct: 100
    - conditions:
      - condition: state
        entity_id: binary_sensor.jalle_studio_sensor_motion
        state: 'off'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.jalle_studio_light_strip
- id: '1772807505103'
  alias: Morning Check-In Alert - Scheduled
  triggers:
  - trigger: time_pattern
    minutes: '*'
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode_toggle
    state: 'off'
  - condition: template
    value_template: "{% set is_weekend = now().weekday() in [5, 6] %} {% if is_weekend
      %}\n  {% set end_time = states('input_datetime.weekend_end_time') %}\n{% else
      %}\n  {% set end_time = states('input_datetime.weekday_end_time') %}\n{% endif
      %} {{ now().strftime('%-I:%M %p') == end_time or now().strftime('%H:%M:%S')
      == end_time }}\n"
  - condition: template
    value_template: "{% set is_weekend = now().weekday() in [5, 6] %} {% set last_motion
      = state_attr('input_datetime.last_morning_motion', 'timestamp') %} {% if is_weekend
      %}\n  {% set start_time = states('input_datetime.weekend_start_time') %}\n  {%
      set end_time = states('input_datetime.weekend_end_time') %}\n{% else %}\n  {%
      set start_time = states('input_datetime.my_weekday_check_in_start') %}\n  {%
      set end_time = states('input_datetime.weekday_end_time') %}\n{% endif %} {%
      set start_today = today_at(start_time).timestamp() %} {% set end_today = today_at(end_time).timestamp()
      %} {% set time_window = end_today - start_today %} {{ last_motion and (now().timestamp()
      - last_motion) > time_window }}\n"
  actions:
  - action: notify.mobile_app_jills_very_cool_phone
    data:
      title: Scheduled Check-In Alert
      message: No motion detected during your custom check-in window.
  - action: persistent_notification.create
    data:
      title: Scheduled Check-In Alert
      message: 'No motion detected during custom check-in window on {{ now().strftime(''%d
        %b %Y at %H:%M'') }}

        '
  mode: single
