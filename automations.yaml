- id: '1771329214326'
  alias: Morning Check-In Alert
  triggers:
  - trigger: time
    at: 07:30:00
  conditions:
  - condition: time
    after: 05:00:00
  - condition: template
    value_template: '{{ (now().timestamp() - state_attr(''input_datetime.last_morning_motion'',
      ''timestamp'')) > 21600 }}

      '
  actions:
  - action: notify.mobile_app_jills_very_cool_phone
    data:
      title: Morning Check-In Alert
      message: No motion detected between 5-7:30 AM.
  - action: persistent_notification.create
    data:
      title: Morning Check-In Alert
      message: 'No motion detected between 5-7:30 AM on {{ now().strftime(''%d %b
        %Y at %H:%M'') }}

        '
- id: '1771333050197'
  alias: Update Last Morning Motion
  triggers:
  - trigger: state
    entity_id: binary_sensor.studio_motion
    to: 'on'
  conditions:
  - condition: time
    after: 05:00:00
    before: 07:30:00
  actions:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.last_morning_motion
    data:
      timestamp: '{{ now().timestamp() }}'
