blueprint:
  name: Morning Check-In - Update Last Motion
  description: >
    Records a timestamp whenever motion is detected on any selected sensor,
    but only during a configurable morning window (separate weekday/weekend
    start and end times, read from dashboard-controlled input_datetime helpers).
  domain: automation
  input:
    motion_sensors:
      name: Motion Sensors
      description: Every sensor whose motion should count as "morning activity" for this check-in.
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    last_motion_helper:
      name: Last Motion Helper
      description: The input_datetime helper this automation updates.
      selector:
        entity:
          domain: input_datetime
    weekday_start:
      name: Weekday Window Start
      selector:
        entity:
          domain: input_datetime
    weekday_end:
      name: Weekday Window End
      selector:
        entity:
          domain: input_datetime
    weekend_start:
      name: Weekend Window Start
      selector:
        entity:
          domain: input_datetime
    weekend_end:
      name: Weekend Window End
      selector:
        entity:
          domain: input_datetime

variables:
  weekday_start_entity: !input weekday_start
  weekday_end_entity: !input weekday_end
  weekend_start_entity: !input weekend_start
  weekend_end_entity: !input weekend_end

triggers:
  - trigger: state
    entity_id: !input motion_sensors
    to: "on"

conditio
